                  Format: |-
                    =TextFormat.Number
                  X: |-
                    =24
                  Y: |-
                    =124
                  Width: |-
                    =376
                  Height: |-
                    =40
                  BorderColor: |-
                    =RGBA(226, 229, 240, 1)
                  Font: |-
                    =Font.'Segoe UI'
