                    ="Start date"
                  X: |-
                    =24
                  Y: |-
                    =176
                  Width: |-
                    =180
                  Height: |-
                    =22
                  Size: |-
                    =11
                  Color: |-
                    =RGBA(107, 115, 153, 1)
                  Font: |-
                    =Font.'Segoe UI'
                  Align: |-
                    =Align.Left
            - dpAssignStart:
                Control: Classic/DatePicker
                Properties:
                  DefaultDate: |-
                    =DateAdd(Today(), 7 - (Weekday(Today(), StartOfWeek.Monday) - 1), TimeUnit.Days)
                  Format: |-
                    ="dd/mm/yyyy"
                  X: |-
                    =24
                  Y: |-
                    =200
                  Width: |-
                    =180
                  Height: |-
                    =40
                  BorderColor: |-
                    =RGBA(226, 229, 240, 1)
                  Font: |-
                    =Font.'Segoe UI'
            - lblEndCap:
                Control: Label
                Properties:
                  Text: |-
                    ="End date"
                  X: |-
                    =220
                  Y: |-
                    =176
                  Width: |-
                    =180
                  Height: |-
                    =22
                  Size: |-
                    =11
                  Color: |-
                    =RGBA(107, 115, 153, 1)
                  Font: |-
                    =Font.'Segoe UI'
                  Align: |-
                    =Align.Left
            - dpAssignEnd:
                Control: Classic/DatePicker
                Properties:
                  DefaultDate: |-
                    =DateAdd(dpAssignStart.SelectedDate, 12 * 7 - 3, TimeUnit.Days)
                  Format: |-
                    ="dd/mm/yyyy"
                  X: |-
                    =220
                  Y: |-
                    =200
                  Width: |-
                    =180
                  Height: |-
                    =40
                  BorderColor: |-
                    =RGBA(226, 229, 240, 1)
                  Font: |-
                    =Font.'Segoe UI'
            - lblAssignCheck:
                Control: Label
                Properties:
                  Text: |-
                    =If(IsBlank(locSel), "",
                        Value(txtAlloc.Text) < 1 || Value(txtAlloc.Text) > 100, "Allocation must be between 1 and 100.",
                        dpAssignEnd.SelectedDate < dpAssignStart.SelectedDate, "The end date can't be before the start date.",
                        With({p: With({s: dpAssignStart.SelectedDate, e: dpAssignEnd.SelectedDate},
                        Max(ForAll(Sequence(Max(1, Min(104, RoundDown(DateDiff(s, e, TimeUnit.Days) / 7, 0) + 1))) As w,
                            With({d: DateAdd(s, (w.Value - 1) * 7, TimeUnit.Days)},
                                Coalesce(Sum(Filter(colAssign, Consultant.Consultant = locSel.Consultant && 'Start Date' <= d && 'End Date' >= d),
                                    'Allocation %'), 0))), Value) + Value(txtAlloc.Text))}, If(p > 100,
                            "Warning: this takes " & locSel.Name & " to " & p & "% in at least one week.",
                            "Peak allocation with this assignment: " & p & "%")))
                  X: |-
                    =24
                  Y: |-
                    =256
                  Width: |-
                    =376
                  Height: |-
                    =64
                  Size: |-
                    =11
                  Color: |-
                    =If(Value(txtAlloc.Text) < 1 || Value(txtAlloc.Text) > 100 || dpAssignEnd.SelectedDate < dpAssignStart.SelectedDate, RGBA(180, 35, 24, 1),
                        !IsBlank(locSel) && With({s: dpAssignStart.SelectedDate, e: dpAssignEnd.SelectedDate},
                        Max(ForAll(Sequence(Max(1, Min(104, RoundDown(DateDiff(s, e, TimeUnit.Days) / 7, 0) + 1))) As w,
                            With({d: DateAdd(s, (w.Value - 1) * 7, TimeUnit.Days)},
                                Coalesce(Sum(Filter(colAssign, Consultant.Consultant = locSel.Consultant && 'Start Date' <= d && 'End Date' >= d),
                                    'Allocation %'), 0))), Value) + Value(txtAlloc.Text)) > 100, RGBA(138, 101, 0, 1), RGBA(15, 122, 82, 1))
                  Font: |-
                    =Font.'Segoe UI'
                  Align: |-
                    =Align.Left
                  VerticalAlign: |-
                    =VerticalAlign.Top
            - btnAssign:
                Control: Classic/Button
                Properties:
                  Text: |-
                    ="Assign"
                  X: |-
                    =24
                  Y: |-
                    =Parent.Height - 128
                  Width: |-
                    =376
                  Height: |-
                    =48
                  Size: |-
                    =13
                  Font: |-
                    =Font.'Segoe UI'
                  FontWeight: |-
                    =FontWeight.Semibold
                  OnSelect: |-
                    =Patch(Assignments, Defaults(Assignments), {
                        Consultant: locSel,
                        Engagement: cmbAssignEng.Selected,
                        'Allocation %': Value(txtAlloc.Text),
                        'Start Date': dpAssignStart.SelectedDate,
                        'End Date': dpAssignEnd.SelectedDate });
                    ClearCollect(colAssign, Assignments);
                    Notify(locSel.Name & " is assigned to " & cmbAssignEng.Selected.Name, NotificationType.Success);
                    UpdateContext({locSel: Blank()}); Reset(txtAlloc)
                  RadiusTopLeft: |-
                    =10
                  RadiusTopRight: |-
                    =10
                  RadiusBottomLeft: |-
                    =10
                  RadiusBottomRight: |-
                    =10
                  Fill: |-
                    =RGBA(31, 42, 92, 1)
                  Color: |-
                    =RGBA(255, 255, 255, 1)
                  HoverFill: |-
                    =RGBA(45, 60, 130, 1)
                  PressedFill: |-
                    =RGBA(45, 60, 130, 1)
                  BorderThickness: |-
                    =0
                  DisabledFill: |-
                    =RGBA(220, 223, 235, 1)
                  DisabledColor: |-
                    =RGBA(107, 115, 153, 1)
                  DisplayMode: |-
                    =If(!IsBlank(locSel) && !IsBlank(cmbAssignEng.Selected)
                        && Value(txtAlloc.Text) >= 1 && Value(txtAlloc.Text) <= 100
                        && dpAssignEnd.SelectedDate >= dpAssignStart.SelectedDate, DisplayMode.Edit, DisplayMode.Disabled)
            - btnAssignBack:
                Control: Classic/Button
                Properties:
                  Text: |-
                    ="Back to People & Skills"
                  X: |-
                    =24
                  Y: |-
                    =Parent.Height - 68
                  Width: |-
                    =376
                  Height: |-
                    =44
                  Size: |-
                    =12
                  Font: |-
                    =Font.'Segoe UI'
                  FontWeight: |-
                    =FontWeight.Semibold
                  OnSelect: |-
                    =Navigate(scrPeople, ScreenTransition.None)
                  RadiusTopLeft: |-
                    =10
                  RadiusTopRight: |-
                    =10
                  RadiusBottomLeft: |-
                    =10
                  RadiusBottomRight: |-
                    =10
                  Fill: |-
                    =RGBA(255, 255, 255, 1)
                  Color: |-
                    =RGBA(31, 42, 92, 1)
                  HoverFill: |-
                    =RGBA(234, 238, 250, 1)
                  HoverColor: |-
                    =RGBA(31, 42, 92, 1)
                  PressedFill: |-
                    =RGBA(234, 238, 250, 1)
                  BorderColor: |-
                    =RGBA(226, 229, 240, 1)
                  BorderThickness: |-
                    =1
