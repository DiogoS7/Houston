            RadiusTopLeft: |-
              =14
            RadiusTopRight: |-
              =14
            RadiusBottomLeft: |-
              =14
            RadiusBottomRight: |-
              =14
          Children:
            - lblAssignEngCap:
                Control: Label
                Properties:
                  Text: |-
                    ="Engagement"
                  X: |-
                    =24
                  Y: |-
                    =16
                  Width: |-
                    =300
                  Height: |-
                    =22
                  Size: |-
                    =11
                  Color: |-
