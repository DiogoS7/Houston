                  Width: |-
                    =376
                  Height: |-
                    =30
                  Size: |-
                    =14
                  Color: |-
                    =If(IsBlank(locSel), RGBA(107, 115, 153, 1), RGBA(31, 42, 92, 1))
                  Font: |-
                    =Font.'Segoe UI'
                  Align: |-
                    =Align.Left
                  FontWeight: |-
                    =FontWeight.Semibold
            - lblAllocCap:
