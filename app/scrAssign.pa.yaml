                  Font: |-
                    =Font.'Segoe UI'
                  Align: |-
                    =Align.Left
            - cmbAssignEng:
                Control: Classic/ComboBox
                Properties:
                  Items: |-
                    =Filter(Engagements, 'Engagement Status' <> 'Engagement Status (Engagements)'.Closed)
                  DisplayFields: |-
                    =["Name"]
                  SearchFields: |-
                    =["Name"]
                  SelectMultiple: |-
                    =false
                  InputTextPlaceholder: |-
                    ="Choose an engagement"
                  OnChange: |-
                    =ClearCollect(colReq, Filter('Engagement Skills', Engagement.Engagement = Self.Selected.Engagement))
                  X: |-
                    =24
                  Y: |-
                    =40
                  Width: |-
                    =420
                  Height: |-
                    =40
                  BorderColor: |-
                    =RGBA(226, 229, 240, 1)
                  Font: |-
                    =Font.'Segoe UI'
            - lblReq:
                Control: Label
                Properties:
                  Text: |-
                    =If(IsBlank(cmbAssignEng.Selected), "Choose an engagement to see the skills it needs.", CountRows(colReq) = 0, "No skills recorded for this engagement.", "Needs: " & Concat(colReq, Skill.Name & " " & 'Required Level' & "+", " · "))
                  X: |-
                    =24
                  Y: |-
                    =88
                  Width: |-
                    =Parent.Width - 48
                  Height: |-
                    =44
                  Size: |-
                    =11
                  Color: |-
                    =RGBA(107, 115, 153, 1)
                  Font: |-
                    =Font.'Segoe UI'
                  Align: |-
                    =Align.Left
                  VerticalAlign: |-
                    =VerticalAlign.Top
            - lblCandTitle:
                Control: Label
                Properties:
                  Text: |-
                    ="Consultants, best match first"
                  X: |-
                    =24
                  Y: |-
                    =140
                  Width: |-
                    =400
                  Height: |-
                    =28
                  Size: |-
                    =13
                  Color: |-
                    =RGBA(27, 33, 64, 1)
                  Font: |-
                    =Font.'Segoe UI'
                  Align: |-
                    =Align.Left
                  FontWeight: |-
                    =FontWeight.Semibold
            - galCand:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |-
                    =Sort(ForAll(Consultants As c, {
                        Consultant: c.Consultant, Name: c.Name, Practice: Text(c.Practice),
                        Matches: CountIf(colReq As r,
                            !IsBlank(LookUp(colCS, Consultant.Consultant = c.Consultant && Skill.Skill = r.Skill.Skill && Proficiency >= r.'Required Level')))
                    }), Matches, SortOrder.Descending)
                  X: |-
                    =8
                  Y: |-
                    =172
                  Width: |-
                    =Parent.Width - 16
                  Height: |-
                    =Parent.Height - 180
                  TemplateSize: |-
                    =56
                  TemplatePadding: |-
                    =0
                  TemplateFill: |-
                    =If(ThisItem.Consultant = locSel.Consultant, RGBA(222, 233, 255, 1), RGBA(0, 0, 0, 0))
                  OnSelect: |-
                    =UpdateContext({locSel: LookUp(Consultants, Consultant = ThisItem.Consultant)})
                Children:
                  - cirAvatarCd:
                      Control: Circle
                      Properties:
                        X: |-
                          =16
                        Y: |-
                          =10
                        Width: |-
                          =36
                        Height: |-
                          =36
                        Fill: |-
                          =Switch(Mod(Len(ThisItem.Name), 5),
                              0, RGBA(107, 91, 255, 1), 1, RGBA(224, 86, 155, 1), 2, RGBA(31, 157, 107, 1),
                              3, RGBA(217, 138, 28, 1), RGBA(61, 107, 255, 1))
                  - lblInitialsCd:
                      Control: Label
                      Properties:
                        Text: |-
                          =Left(ThisItem.Name, 1) & Left(Last(Split(ThisItem.Name, " ")).Value, 1)
                        X: |-
                          =16
                        Y: |-
                          =10
                        Width: |-
                          =36
                        Height: |-
                          =36
                        Size: |-
                          =10
                        Color: |-
                          =RGBA(255, 255, 255, 1)
                        Font: |-
                          =Font.'Segoe UI'
                        Align: |-
                          =Align.Center
                        FontWeight: |-
                          =FontWeight.Semibold
                  - lblCdName:
                      Control: Label
                      Properties:
                        Text: |-
                          =ThisItem.Name
                        X: |-
                          =62
                        Y: |-
                          =4
                        Width: |-
                          =260
                        Height: |-
                          =26
                        Size: |-
                          =12
                        Color: |-
                          =RGBA(27, 33, 64, 1)
                        Font: |-
                          =Font.'Segoe UI'
                        Align: |-
                          =Align.Left
                        FontWeight: |-
                          =FontWeight.Semibold
                  - lblCdInfo:
                      Control: Label
                      Properties:
                        Text: |-
                          =ThisItem.Practice & " · next 4 weeks " & Round(Average(ForAll(Sequence(4) As w,
                              With({d: DateAdd(Today(), (w.Value - 1) * 7, TimeUnit.Days)},
                                  Coalesce(Sum(Filter(colAssign, Consultant.Consultant = ThisItem.Consultant && 'Start Date' <= d && 'End Date' >= d), 'Allocation %'), 0))),
                              Value), 0) & "% allocated"
                        X: |-
                          =62
                        Y: |-
                          =28
                        Width: |-
                          =Parent.TemplateWidth - 230
                        Height: |-
                          =22
                        Size: |-
                          =10
                        Color: |-
                          =RGBA(107, 115, 153, 1)
                        Font: |-
                          =Font.'Segoe UI'
                        Align: |-
                          =Align.Left
                  - btnMatch:
                      Control: Classic/Button
                      Properties:
                        Text: |-
                          =If(ThisItem.Matches = CountRows(colReq), "Meets all", ThisItem.Matches & " of " & CountRows(colReq))
                        X: |-
                          =Parent.TemplateWidth - 140
                        Y: |-
                          =14
                        Width: |-
                          =120
                        Height: |-
                          =28
                        Size: |-
                          =10
                        Font: |-
                          =Font.'Segoe UI'
                        FontWeight: |-
                          =FontWeight.Semibold
                        DisplayMode: |-
                          =DisplayMode.Disabled
                        DisabledFill: |-
                          =If(ThisItem.Matches = CountRows(colReq), RGBA(215, 245, 232, 1), ThisItem.Matches > 0, RGBA(255, 241, 194, 1), RGBA(236, 238, 245, 1))
                        DisabledColor: |-
                          =If(ThisItem.Matches = CountRows(colReq), RGBA(15, 122, 82, 1), ThisItem.Matches > 0, RGBA(138, 101, 0, 1), RGBA(107, 115, 153, 1))
                        DisabledBorderColor: |-
                          =If(ThisItem.Matches = CountRows(colReq), RGBA(215, 245, 232, 1), ThisItem.Matches > 0, RGBA(255, 241, 194, 1), RGBA(236, 238, 245, 1))
                        BorderThickness: |-
                          =0
                        RadiusTopLeft: |-
                          =14
                        RadiusTopRight: |-
                          =14
                        RadiusBottomLeft: |-
                          =14
                        RadiusBottomRight: |-
                          =14
                        Visible: |-
                          =CountRows(colReq) > 0
                  - recCdDivider:
                      Control: Rectangle
                      Properties:
                        X: |-
                          =0
                        Y: |-
                          =Parent.TemplateHeight - 1
                        Width: |-
                          =Parent.TemplateWidth
                        Height: |-
                          =1
                        Fill: |-
                          =RGBA(236, 238, 245, 1)
      - conAssignDetail:
