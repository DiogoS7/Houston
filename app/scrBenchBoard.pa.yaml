      - galWeekHeaders:
          Control: Gallery
          Variant: Horizontal
          Properties:
            Items: |-
              =ForAll(Sequence(6) As w, {Wk: DateAdd(gblBenchStart, (w.Value - 1) * 7, TimeUnit.Days)})
            X: |-
              =Parent.Width - 664
            Y: |-
