Screens:
  scrBenchBoard:
    Properties:
      Fill: =RGBA(246, 247, 251, 1)
      OnVisible: |-
        =Set(gblBenchStart, DateAdd(Today(), -(Weekday(Today(), StartOfWeek.Monday) - 1), TimeUnit.Days));
        ClearCollect(colAssign, Assignments)
    Children:
      - recHeaderB:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =64
            Fill: =RGBA(31, 42, 92, 1)
      - lblAppNameB:
          Control: Label
          Properties:
            Text: ="Houston"
            X: =32
            Y: =0
            Width: =150
            Height: =64
            Size: =20
            FontWeight: =FontWeight.Bold
            Color: =RGBA(255, 255, 255, 1)
      - lblUserB:
          Control: Label
          Properties:
            Text: =gblMe.Name
            X: =Parent.Width - 332
            Y: =0
            Width: =300
            Height: =64
            Align: =Align.Right
            Size: =13
            Color: =RGBA(190, 200, 235, 1)
      - lblNavTimesheetB:
          Control: Label
          Properties:
            Text: ="My Timesheet"
            X: =200
            Y: =0
            Width: =130
            Height: =64
            Align: =Align.Center
            Size: =13
            Color: =RGBA(190, 200, 235, 1)
            OnSelect: =Navigate(scrMyTimesheet, ScreenTransition.None)
      - lblNavBenchB:
          Control: Label
          Properties:
            Text: ="Bench Board"
            X: =330
            Y: =0
            Width: =130
            Height: =64
            Align: =Align.Center
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(255, 255, 255, 1)
      - recNavUnderlineB:
          Control: Rectangle
          Properties:
            X: =350
            Y: =58
            Width: =90
            Height: =3
            Fill: =RGBA(62, 230, 168, 1)
      - lblTitleB:
          Control: Label
          Properties:
            Text: ="Bench Board"
            X: =40
            Y: =84
            Width: =400
            Height: =44
            Size: =24
            FontWeight: =FontWeight.Bold
            Color: =RGBA(27, 33, 64, 1)
      - lblSubtitleB:
          Control: Label
          Properties:
            Text: ="Allocation per consultant for the next 6 weeks, compared with each consultant's target utilisation."
            X: =40
            Y: =128
            Width: =800
            Height: =28
            Size: =12
            Color: =RGBA(107, 115, 153, 1)
      - lblLegendFull:
          Control: Label
          Properties:
            Text: ="At or above target"
            X: =Parent.Width - 520
            Y: =96
            Width: =150
            Height: =28
            Align: =Align.Center
            Size: =10
            FontWeight: =FontWeight.Semibold
            Fill: =RGBA(215, 245, 232, 1)
            Color: =RGBA(15, 122, 82, 1)
      - lblLegendPartial:
          Control: Label
          Properties:
            Text: ="Below target"
            X: =Parent.Width - 360
            Y: =96
            Width: =150
            Height: =28
            Align: =Align.Center
            Size: =10
            FontWeight: =FontWeight.Semibold
            Fill: =RGBA(255, 241, 194, 1)
            Color: =RGBA(138, 101, 0, 1)
      - lblLegendBench:
          Control: Label
          Properties:
            Text: ="On the bench"
            X: =Parent.Width - 200
            Y: =96
            Width: =160
            Height: =28
            Align: =Align.Center
            Size: =10
            FontWeight: =FontWeight.Semibold
            Fill: =RGBA(255, 217, 217, 1)
            Color: =RGBA(180, 35, 24, 1)
      - recBoardCard:
          Control: Rectangle
          Properties:
            X: =40
            Y: =172
            Width: =Parent.Width - 80
            Height: =Parent.Height - 204
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(226, 229, 240, 1)
            BorderThickness: =1
      - lblColConsultant:
          Control: Label
          Properties:
            Text: ="Consultant"
            X: =64
            Y: =184
            Width: =300
            Height: =36
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(107, 115, 153, 1)
      - galWeekHeaders:
          Control: Gallery
          Variant: Horizontal
          Properties:
            Items: |-
              =ForAll(Sequence(6) As w, {Wk: DateAdd(gblBenchStart, (w.Value - 1) * 7, TimeUnit.Days)})
            X: =Parent.Width - 656
            Y: =184
            Width: =600
            Height: =40
            TemplateSize: =100
            TemplatePadding: =0
            ShowScrollbar: =false
          Children:
            - lblWeekHeader:
                Control: Label
                Properties:
                  Text: ="W" & ISOWeekNum(ThisItem.Wk) & " · " & Text(ThisItem.Wk, "dd/mm")
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =36
                  Align: =Align.Center
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(107, 115, 153, 1)
      - galBench:
          Control: Gallery
          Variant: Vertical
          Properties:
            Items: =Sort(Consultants, Name, SortOrder.Ascending)
            X: =48
            Y: =232
            Width: =Parent.Width - 96
            Height: =Parent.Height - 264
            TemplateSize: =60
            TemplatePadding: =0
          Children:
            - cirAvatar:
                Control: Circle
                Properties:
                  X: =16
                  Y: =12
                  Width: =36
                  Height: =36
                  Fill: |-
                    =Switch(Mod(Len(ThisItem.Name), 5),
                        0, RGBA(107, 91, 255, 1),
                        1, RGBA(224, 86, 155, 1),
                        2, RGBA(31, 157, 107, 1),
                        3, RGBA(217, 138, 28, 1),
                        RGBA(61, 107, 255, 1))
            - lblInitials:
                Control: Label
                Properties:
                  Text: =Left(ThisItem.Name, 1) & Left(Last(Split(ThisItem.Name, " ")).Value, 1)
                  X: =16
                  Y: =12
                  Width: =36
                  Height: =36
                  Align: =Align.Center
                  Size: =10
                  FontWeight: =FontWeight.Bold
                  Color: =RGBA(255, 255, 255, 1)
            - lblConsultantName:
                Control: Label
                Properties:
                  Text: =ThisItem.Name
                  X: =64
                  Y: =8
                  Width: =280
                  Height: =24
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(27, 33, 64, 1)
            - lblConsultantTarget:
                Control: Label
                Properties:
                  Text: ="Target " & ThisItem.'Target Utilisation' & "%" & If(IsBlank(ThisItem.Manager), " · Manager", " · reports to " & ThisItem.Manager.Name)
                  X: =64
                  Y: =30
                  Width: =320
                  Height: =22
                  Size: =10
                  Color: =RGBA(107, 115, 153, 1)
            - galCells:
                Control: Gallery
                Variant: Horizontal
                Properties:
                  Items: |-
                    =ForAll(Sequence(6) As w,
                        With({wk: DateAdd(gblBenchStart, (w.Value - 1) * 7, TimeUnit.Days)},
                            {
                                Wk: wk,
                                Target: ThisItem.'Target Utilisation',
                                Alloc: Coalesce(Sum(Filter(colAssign,
                                    Consultant.Consultant = ThisItem.Consultant
                                    && 'Start Date' <= wk && 'End Date' >= wk), 'Allocation %'), 0)
                            }))
                  X: =Parent.TemplateWidth - 608
                  Y: =10
                  Width: =600
                  Height: =40
                  TemplateSize: =100
                  TemplatePadding: =0
                  ShowScrollbar: =false
                Children:
                  - lblCell:
                      Control: Label
                      Properties:
                        Text: =ThisItem.Alloc & "%"
                        X: =4
                        Y: =0
                        Width: =Parent.TemplateWidth - 8
                        Height: =40
                        Align: =Align.Center
                        Size: =11
                        FontWeight: =FontWeight.Bold
                        Fill: |-
                          =If(ThisItem.Alloc >= ThisItem.Target, RGBA(215, 245, 232, 1),
                              ThisItem.Alloc > 0, RGBA(255, 241, 194, 1),
                              RGBA(255, 217, 217, 1))
                        Color: |-
                          =If(ThisItem.Alloc >= ThisItem.Target, RGBA(15, 122, 82, 1),
                              ThisItem.Alloc > 0, RGBA(138, 101, 0, 1),
                              RGBA(180, 35, 24, 1))
            - recRowDivider:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  Height: =1
                  Fill: =RGBA(236, 238, 245, 1)
