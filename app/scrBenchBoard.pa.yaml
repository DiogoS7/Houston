            Height: |-
              =32
            TemplateSize: |-
              =100
            TemplatePadding: |-
              =0
            ShowScrollbar: |-
              =false
          Children:
            - lblWeekHeader:
                Control: Label
                Properties:
                  Text: |-
                    ="W" & ISOWeekNum(ThisItem.Wk) & " · " & Text(ThisItem.Wk, "dd/mm")
                  X: |-
