            Y: |-
              =0
            Width: |-
              =140
            Height: |-
              =64
            Size: |-
              =20
            Color: |-
              =RGBA(255, 255, 255, 1)
            Font: |-
              =Font.'Segoe UI'
            Align: |-
              =Align.Left
            FontWeight: |-
              =FontWeight.Semibold
