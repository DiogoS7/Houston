      - galBench:
          Control: Gallery
          Variant: Vertical
          Properties:
            Items: |-
              =Sort(Consultants, Name, SortOrder.Ascending)
            X: |-
              =48
            Y: |-
              =224
            Width: |-
              =Parent.Width - 96
            Height: |-
              =Parent.Height - 260
            TemplateSize: |-
              =60
            TemplatePadding: |-
              =0
          Children:
            - cirAvatar:
                Control: Circle
                Properties:
                  X: |-
                    =16
                  Y: |-
                    =12
                  Width: |-
                    =36
                  Height: |-
                    =36
                  Fill: |-
                    =Switch(Mod(Len(ThisItem.Name), 5),
                        0, RGBA(107, 91, 255, 1), 1, RGBA(224, 86, 155, 1), 2, RGBA(31, 157, 107, 1),
                        3, RGBA(217, 138, 28, 1), RGBA(61, 107, 255, 1))
            - lblInitials:
                Control: Label
                Properties:
                  Text: |-
                    =Left(ThisItem.Name, 1) & Left(Last(Split(ThisItem.Name, " ")).Value, 1)
                  X: |-
                    =16
                  Y: |-
                    =12
                  Width: |-
                    =36
                  Height: |-
                    =36
                  Size: |-
                    =10
                  Color: |-
                    =RGBA(255, 255, 255, 1)
                  Font: |-
                    =Font.'Segoe UI'
                  Align: |-
                    =Align.Center
                  FontWeight: |-
                    =FontWeight.Semibold
            - lblConsultantName:
                Control: Label
                Properties:
                  Text: |-
                    =ThisItem.Name
                  X: |-
                    =64
                  Y: |-
                    =8
                  Width: |-
                    =280
                  Height: |-
                    =24
                  Size: |-
                    =13
                  Color: |-
                    =RGBA(27, 33, 64, 1)
                  Font: |-
                    =Font.'Segoe UI'
                  Align: |-
                    =Align.Left
                  FontWeight: |-
                    =FontWeight.Semibold
            - lblConsultantTarget:
                Control: Label
                Properties:
                  Text: |-
                    ="Target " & ThisItem.'Target Utilisation' & "%" & If(IsBlank(ThisItem.Manager), " · Manager", " · reports to " & ThisItem.Manager.Name)
                  X: |-
                    =64
                  Y: |-
                    =30
                  Width: |-
                    =340
                  Height: |-
                    =22
                  Size: |-
                    =10
                  Color: |-
                    =RGBA(107, 115, 153, 1)
                  Font: |-
                    =Font.'Segoe UI'
                  Align: |-
                    =Align.Left
            - galCells:
                Control: Gallery
                Variant: Horizontal
                Properties:
                  Items: |-
                    =ForAll(Sequence(6) As w,
                        With({wk: DateAdd(gblBenchStart, (w.Value - 1) * 7, TimeUnit.Days)},
                            {
                                Wk: wk,
                                Target: ThisItem.'Target Utilisation',
                                Alloc: Coalesce(Sum(Filter(colAssign,
                                    Consultant.Consultant = ThisItem.Consultant
                                    && 'Start Date' <= wk && 'End Date' >= wk), 'Allocation %'), 0)
                            }))
                  X: |-
                    =Parent.TemplateWidth - 608
                  Y: |-
                    =8
                  Width: |-
                    =600
                  Height: |-
                    =44
                  TemplateSize: |-
                    =100
                  TemplatePadding: |-
                    =0
                  ShowScrollbar: |-
                    =false
                Children:
                  - btnCell:
                      Control: Classic/Button
                      Properties:
                        Text: |-
                          =ThisItem.Alloc & "%"
                        X: |-
                          =4
                        Y: |-
                          =4
                        Width: |-
                          =Parent.TemplateWidth - 8
                        Height: |-
                          =36
                        Size: |-
                          =11
                        Font: |-
                          =Font.'Segoe UI'
                        FontWeight: |-
                          =FontWeight.Semibold
                        DisplayMode: |-
                          =DisplayMode.Disabled
                        DisabledFill: |-
                          =If(ThisItem.Alloc >= ThisItem.Target, RGBA(215, 245, 232, 1), ThisItem.Alloc > 0, RGBA(255, 241, 194, 1), RGBA(255, 217, 217, 1))
                        DisabledColor: |-
                          =If(ThisItem.Alloc >= ThisItem.Target, RGBA(15, 122, 82, 1), ThisItem.Alloc > 0, RGBA(138, 101, 0, 1), RGBA(180, 35, 24, 1))
                        DisabledBorderColor: |-
                          =If(ThisItem.Alloc >= ThisItem.Target, RGBA(215, 245, 232, 1), ThisItem.Alloc > 0, RGBA(255, 241, 194, 1), RGBA(255, 217, 217, 1))
                        BorderThickness: |-
                          =0
                        RadiusTopLeft: |-
                          =8
                        RadiusTopRight: |-
                          =8
                        RadiusBottomLeft: |-
                          =8
                        RadiusBottomRight: |-
                          =8
            - recRowDivider:
                Control: Rectangle
                Properties:
                  X: |-
                    =0
                  Y: |-
                    =Parent.TemplateHeight - 1
                  Width: |-
                    =Parent.TemplateWidth
                  Height: |-
                    =1
                  Fill: |-
                    =RGBA(236, 238, 245, 1)
