Screens:
  scrHome:
    Properties:
      Fill: |-
        =RGBA(246, 247, 251, 1)
      OnVisible: |-
        =If(IsBlank(gblMe), Set(gblMe, LookUp(Consultants, Name = "Ana Lopes")));
        If(IsBlank(gblWeekStart), Set(gblWeekStart, DateAdd(Today(), -(Weekday(Today(), StartOfWeek.Monday) - 1), TimeUnit.Days)));
